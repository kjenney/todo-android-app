name: Auto Release

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'

jobs:
  check-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper versioning

      - name: Get latest tag
        id: get_latest_tag
        run: |
          # Get the latest tag, or use v0.0.0 if no tags exist
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG"

      - name: Determine version bump
        id: determine_bump
        run: |
          # Get commit messages since last tag
          LATEST_TAG="${{ steps.get_latest_tag.outputs.latest_tag }}"

          if [ "$LATEST_TAG" = "v0.0.0" ]; then
            COMMITS=$(git log --pretty=format:"%s" -10)
          else
            COMMITS=$(git log $LATEST_TAG..HEAD --pretty=format:"%s")
          fi

          echo "Commits since last tag:"
          echo "$COMMITS"

          # Default to patch bump
          BUMP_TYPE="patch"

          # Check for breaking changes or major keywords
          if echo "$COMMITS" | grep -qiE "^(BREAKING CHANGE:|major:|!:|\[major\])"; then
            BUMP_TYPE="major"
          # Check for new features
          elif echo "$COMMITS" | grep -qiE "^(feat:|feature:|minor:|\[minor\]|Add|Added)"; then
            BUMP_TYPE="minor"
          # Check for fixes, updates, or other changes
          elif echo "$COMMITS" | grep -qiE "^(fix:|bugfix:|patch:|\[patch\]|Fix|Fixed|Update)"; then
            BUMP_TYPE="patch"
          fi

          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "Determined bump type: $BUMP_TYPE"

      - name: Calculate new version
        id: calculate_version
        run: |
          LATEST_TAG="${{ steps.get_latest_tag.outputs.latest_tag }}"
          BUMP_TYPE="${{ steps.determine_bump.outputs.bump_type }}"

          # Remove 'v' prefix and split version
          VERSION=${LATEST_TAG#v}

          IFS='.' read -r -a VERSION_PARTS <<< "$VERSION"
          MAJOR="${VERSION_PARTS[0]:-0}"
          MINOR="${VERSION_PARTS[1]:-0}"
          PATCH="${VERSION_PARTS[2]:-0}"

          # Bump version based on type
          case $BUMP_TYPE in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version will be: $NEW_VERSION"

      - name: Check if version already exists
        id: check_version
        run: |
          NEW_VERSION="${{ steps.calculate_version.outputs.new_version }}"
          if git rev-parse "$NEW_VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $NEW_VERSION already exists, skipping release"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $NEW_VERSION does not exist, will create"
          fi

      - name: Create and push tag
        if: steps.check_version.outputs.exists == 'false'
        run: |
          NEW_VERSION="${{ steps.calculate_version.outputs.new_version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
          git push origin "$NEW_VERSION"

          echo "Created and pushed tag: $NEW_VERSION"

      - name: Set up JDK 17
        if: steps.check_version.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        if: steps.check_version.outputs.exists == 'false'
        run: chmod +x gradlew

      - name: Decode Keystore
        if: steps.check_version.outputs.exists == 'false'
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ENCODED_STRING" ]; then
            echo $ENCODED_STRING | base64 -di > app/keystore.jks
            echo "KEYSTORE_EXISTS=true" >> $GITHUB_ENV
          else
            echo "KEYSTORE_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Build Signed Release APK
        if: steps.check_version.outputs.exists == 'false' && env.KEYSTORE_EXISTS == 'true'
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/keystore.jks \
            -Pandroid.injected.signing.store.password=$SIGNING_STORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$SIGNING_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$SIGNING_KEY_PASSWORD

      - name: Build Debug APK
        if: steps.check_version.outputs.exists == 'false'
        run: ./gradlew assembleDebug

      - name: Get APK filenames
        if: steps.check_version.outputs.exists == 'false'
        id: get_apk
        run: |
          DEBUG_APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          DEBUG_APK_NAME="todo-app-${{ steps.calculate_version.outputs.new_version }}-debug.apk"

          if [ "${{ env.KEYSTORE_EXISTS }}" = "true" ]; then
            RELEASE_APK_PATH="app/build/outputs/apk/release/app-release.apk"
            RELEASE_APK_NAME="todo-app-${{ steps.calculate_version.outputs.new_version }}.apk"
            echo "release_apk_path=$RELEASE_APK_PATH" >> $GITHUB_OUTPUT
            echo "release_apk_name=$RELEASE_APK_NAME" >> $GITHUB_OUTPUT
            echo "has_signed=true" >> $GITHUB_OUTPUT
          else
            echo "has_signed=false" >> $GITHUB_OUTPUT
          fi

          echo "debug_apk_path=$DEBUG_APK_PATH" >> $GITHUB_OUTPUT
          echo "debug_apk_name=$DEBUG_APK_NAME" >> $GITHUB_OUTPUT

      - name: Update release notes with APK info
        if: steps.check_version.outputs.exists == 'false'
        run: |
          NEW_VERSION="${{ steps.calculate_version.outputs.new_version }}"
          DEBUG_APK_NAME="${{ steps.get_apk.outputs.debug_apk_name }}"
          HAS_SIGNED="${{ steps.get_apk.outputs.has_signed }}"
          BUMP_TYPE="${{ steps.determine_bump.outputs.bump_type }}"
          LATEST_TAG="${{ steps.get_latest_tag.outputs.latest_tag }}"

          # Generate release notes from commits
          if [ "$LATEST_TAG" = "v0.0.0" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" -10)
          else
            COMMITS=$(git log $LATEST_TAG..HEAD --pretty=format:"- %s (%h)")
          fi

          # Build download section based on available APKs
          DOWNLOAD_SECTION="### Download

          📦 **Debug APK:** \`$DEBUG_APK_NAME\`"

          if [ "$HAS_SIGNED" = "true" ]; then
            RELEASE_APK_NAME="${{ steps.get_apk.outputs.release_apk_name }}"
            DOWNLOAD_SECTION="$DOWNLOAD_SECTION
          📦 **Signed Release APK:** \`$RELEASE_APK_NAME\`"
          fi

          DOWNLOAD_SECTION="$DOWNLOAD_SECTION

          Download the APK file attached to this release and install it on your Android device (API 24+).

          **Note:** Use the debug APK for development/testing. The signed release APK is recommended for production use if available."

          # Create release notes file with APK reference
          cat > release_notes.md << EOF
          ## Release $NEW_VERSION

          **Version Type:** ${BUMP_TYPE^} release

          ### Changes

          $COMMITS

          $DOWNLOAD_SECTION

          ---

          *Generated automatically by GitHub Actions*
          EOF

          echo "Updated release notes:"
          cat release_notes.md

      - name: Create GitHub Release
        if: steps.check_version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.calculate_version.outputs.new_version }}
          name: ${{ steps.calculate_version.outputs.new_version }}
          body_path: release_notes.md
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always() && steps.check_version.outputs.exists == 'false'
        run: rm -f app/keystore.jks
